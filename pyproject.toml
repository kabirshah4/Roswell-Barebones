[project]
name = "diy-terminal"
version = "0.1.0"
description = "Local market research terminal"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69,<1.0",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "uvicorn[standard]>=0.30",
    "webauthn>=2.0",
    "yfinance>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real Yahoo API (deselected by default)"]
addopts = "-m 'not live'"

[tool.uv]
package = false
