name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what happened instead of what you expected.
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Output of /api/health
      description: >
        Run `curl -s http://127.0.0.1:8000/api/health` with the server up.
        This reports which subsystems are enabled and is usually enough to
        explain an empty panel.
      render: json
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
